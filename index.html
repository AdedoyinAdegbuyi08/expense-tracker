<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1>Expense Tracker</h1>
            <section class="card">
                <h2 id="form-title">Add Expense</h2>
                <form id="expense-form" novalidate>
                    <input type="hidden" id="expense-id">
                    <label for="title">Title<input id="title" name="title" type="text" placeholder="e.g Breakfast"></label>
                    <br><br>
                    <label for="amount">Amount (₦)<input id="amount" name="amount" type="number" placeholder="0.00" step="0.01"> </label>
                    <br><br>
                    <label for="category">Category
                        <select id="category">
                            <option value="">Select a category</option>
                            <option value="Food">Food</option>
                            <option value="Bills">Bills</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                    </label>
                    <br><br>
                    <label for="date">Date: <input id="date" name="date" type="date"></label>
                    <br><br>
                    <p id="error" class="error" role="alert"></p>
                    <div class="row">
                        <button type="submit" id="submit-btn">Add</button>
                        <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
                    </div>
                </form>
            </section>
            <section class="card">
                <h2>Filter</h2>
                <label for="filter-category">Category: 
                     <select id="filter-category">
                        <option value="">All categories</option>
                        <option value="Food">Food</option>
                        <option value="Bills">Bills</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                </label>
                <br><br>
                <label for="filter-date">Date<input id="filter-date" name="filter-date" type="date"></label>
                <br><br>
                <button type="button" id="clear-filters" class="secondary">Clear filters</button>
            </section>
            <br>
            <section class="total">
                <span>Total expense</span>
                <strong id="total">0.00</strong>
            </section>

            <ul id="list"></ul>
            <p id="empty" class="empty" hidden>No expenses to display.</p>
        </main>
        <script src="script.js"></script>
    </body>
</html>
